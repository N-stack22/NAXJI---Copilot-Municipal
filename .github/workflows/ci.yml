name: Calidad aislada

'on':
  pull_request:
  push:
    branches: [main, 'feature/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg18@sha256:2358fcba361ed2233a5ed81b5fe4ca779ccb304120ce531a3bf51c0ed7e2bc11
        env:
          POSTGRES_USER: naxji_step3
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 15432:5432
        options: >-
          --health-cmd "pg_isready -U naxji_step3"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      NAXJI_PERSISTENCE_MODE: memory
      NAXJI_AUTH_MODE: mock
      NAXJI_RAG_ENABLED: 'false'
      NAXJI_PMV3_ENABLED: 'false'
      NAXJI_TEST_PG_PORT: '15432'
      NAXJI_RUN_DB_TESTS: '0'
      NAXJI_RUN_AUTH_TESTS: '0'
      NAXJI_RUN_OLLAMA_TESTS: '0'
      NAXJI_RUN_PMV2_AI_TESTS: '0'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0 # El inventario contrasta los componentes protegidos con 7359a67.
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - name: Instalar backend y QA
        run: python -m pip install -r requirements-runtime.lock.txt -r requirements-test.txt "build>=1.2,<2"
      - name: Persistencia y arquitectura aisladas
        run: python -m pytest -q -ra
      - name: Instalar frontend reproducible
        run: npm ci
      - name: Frontend, lint y build
        run: |
          npm run test:frontend
          npm run lint
          npm run build
      - name: Empaquetar backend
        run: python -m build --outdir build/backend
      - name: Auditar todas las dependencias y recursos SQL
        run: python scripts/auditar_cierre_estatico.py --salida "$RUNNER_TEMP/auditoria-naxji"
      - name: Construir imagen de despliegue sin secretos
        run: |
          docker build -t naxji-ci .
          test "$(docker image inspect --format '{{.Config.User}}' naxji-ci)" = "10001"
          docker run --rm --entrypoint python naxji-ci -c "from importlib.resources import files; import src.adapters.out.persistence as p; resources=list(files(p).joinpath('sql').glob('*/*.sql')); assert resources and all(r.read_text().strip() for r in resources); print(len(resources))"
      - name: Verificar diff
        run: git diff --check
